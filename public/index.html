<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>barir korcha - Expense Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF & AutoTable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        .drawer {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .drawer.active {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <button id="menuToggle" class="p-2 focus:outline-none hover:bg-slate-800 rounded">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-xl font-bold tracking-wide">barir korcha</h1>
        </div>
    </header>

    <!-- Drawer Navigation (PDF Download Options) -->
    <aside id="drawerMenu" class="drawer fixed top-0 left-0 h-full w-80 bg-white shadow-2xl z-50 p-6 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-900">Download Reports</h2>
                <button id="closeDrawer" class="text-slate-500 hover:text-slate-800 text-xl font-bold">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Select Month</label>
                    <select id="pdfMonth" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="">All Months</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Select Year</label>
                    <input type="number" id="pdfYear" placeholder="e.g. 2026" class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <button id="downloadPdfBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded shadow transition-colors">
                    Download PDF Report
                </button>
            </div>
        </div>
        <div class="text-xs text-slate-400 text-center">
            &copy; barir korcha - Personal Expense Tracker
        </div>
    </aside>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Expense Form Card -->
        <section class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Add / Edit Expense</h2>
            
            <form id="expenseForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Expense Title with Auto Suggestions -->
                    <div class="relative">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Expense Title</label>
                        <input type="text" id="title" list="expenseSuggestions" placeholder="e.g. Bazar, Electricity" required class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <datalist id="expenseSuggestions"></datalist>

                        <!-- Category Spend Badge Indicator -->
                        <div id="categorySpendBadge" class="mt-1 text-xs text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-200 hidden">
                            Category Total: <span id="categorySpendAmount" class="font-bold">₹0.00</span>
                        </div>
                    </div>

                    <!-- Expense Amount -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                        <input type="number" step="0.01" id="amount" placeholder="0.00" required class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <!-- Expense Date -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                        <input type="date" id="expense_date" required class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2 rounded text-sm font-medium transition-colors shadow">
                        Save Expense
                    </button>
                </div>
            </form>
        </section>

        <!-- Search / Filter Section -->
        <section class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <h3 class="text-md font-semibold text-slate-700">All Expense Records</h3>
            <div class="w-1/2 md:w-1/3">
                <input type="text" id="searchInput" placeholder="Search by title..." class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
        </section>

        <!-- Expense Transactions Table -->
        <section class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-sm font-semibold">
                            <th class="p-3">Date</th>
                            <th class="p-3">Title</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList" class="text-sm divide-y divide-slate-100">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-400">Loading expenses...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Category Wise Spend Summary Section -->
        <section class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-md font-bold text-slate-800 mb-3">Category Totals Summary</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold">
                            <th class="p-2">Category</th>
                            <th class="p-2">Total Amount Spent</th>
                        </tr>
                    </thead>
                    <tbody id="categorySummaryList" class="text-sm divide-y divide-slate-100">
                        <tr>
                            <td colspan="2" class="p-2 text-center text-slate-400">Loading summary...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Custom Style Helper for Edit/Delete Buttons -->
    <style>
        .btn-edit {
            background-color: #3b82f6;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 4px;
        }
        .btn-edit:hover {
            background-color: #2563eb;
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }
    </style>

    <!-- Custom JS File -->
    <script src="app.js"></script>
</body>
</html>
